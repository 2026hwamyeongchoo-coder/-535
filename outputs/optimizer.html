  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#187e9d 0,#07364b 38%,#031923 78%);color:#eefbff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #68c7dc55;background:#031b28e8;box-shadow:0 8px 24px #00101a88}.brand{display:flex;align-items:center;gap:12px}.brand strong{font-size:20px;line-height:.85}.brand span{display:block;margin-top:6px;color:#ffd34c;font-size:10px;letter-spacing:.17em}.top nav{display:flex;gap:8px}button,a{border:0;border-radius:8px;padding:10px 14px;background:#126b93;color:white;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}button:hover,a:hover{filter:brightness(1.17)}.primary{background:linear-gradient(135deg,#20c0dc,#0867a6);box-shadow:0 4px 0 #043e68}.layout{display:grid;grid-template-columns:270px minmax(430px,1fr) 270px;gap:16px;padding:16px;min-height:calc(100vh - 72px)}.panel{border:1px solid #5bafc4;border-radius:14px;background:#061f2deb;box-shadow:0 12px 30px #00101a99;overflow:hidden}.panel h2{margin:0;padding:13px 15px;border-bottom:1px solid #4f92a766;font-size:15px}.manifest{max-height:calc(100vh - 178px);overflow:auto;padding:9px}.cargo{display:flex;align-items:center;gap:9px;margin-bottom:7px;padding:9px;border:1px solid #356d82;border-radius:8px;background:#0b2c3c}.swatch{width:34px;height:25px;border-radius:3px;box-shadow:inset 0 0 0 2px #ffffff66}.cargo div:nth-child(2){flex:1}.cargo b{display:block;font-size:12px}.cargo small{color:#a9cbd6;font-size:10px}.cargo em{font-style:normal;color:#ffd84c;font-size:12px;font-weight:900}.work{display:flex;flex-direction:column;min-height:620px}.stage-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid #4f92a766}.stage-head h2{padding:0;border:0}.status{font-size:12px;color:#7de9dd}.view-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 15px}.view-tabs button{padding:7px 10px;background:#0d3446;font-size:11px;border:1px solid #3e7182}.view-tabs button.active{background:#1681a5;border-color:#8bf2f2}.ship-wrap{position:relative;flex:1;display:grid;place-items:center;padding:18px;overflow:hidden}.ship-wrap:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#44d7e408 0 1px,transparent 1px 34px),linear-gradient(#0d688550,#052a3d33)}.ship{position:relative;width:min(680px,90%);aspect-ratio:12/5;padding:18px 28px;clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:#a7bbc0;border:5px solid #d4e4e6;filter:drop-shadow(0 14px 17px #0009)}.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(5,1fr);gap:3px}.cell{position:relative;display:grid;place-items:center;min-width:0;border:1px solid #9dd9df88;background:#173b47;color:#fff;font-size:8px;font-weight:900;transition:.2s}.cell.filled{box-shadow:inset 0 0 0 1px #ffffff80,0 2px 5px #0007}.cell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.cell i{position:absolute;right:2px;bottom:1px;font-size:7px;font-style:normal;color:#fff}.legend{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;padding:10px 14px 15px;color:#b4d4dc;font-size:10px}.legend span:before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px;background:var(--c)}.summary{padding:12px}.score-ring{position:relative;width:132px;height:132px;margin:8px auto 16px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#42dbaa calc(var(--score)*1%),#153b49 0);box-shadow:0 0 24px #20d5cc44}.score-ring:before{content:"";position:absolute;width:105px;height:105px;border-radius:50%;background:#082534}.score-ring b{position:relative;font-size:35px}.metric{margin:13px 0}.metric div{display:flex;justify-content:space-between;font-size:12px}.metric-track{height:8px;margin-top:5px;border-radius:5px;overflow:hidden;background:#102e3a}.metric-track i{display:block;height:100%;width:var(--value);background:linear-gradient(90deg,#20a9d2,#49dea5);transition:.45s}.balance-map{position:relative;height:44px;margin-top:15px;border:1px solid #46798a;border-radius:7px;background:linear-gradient(90deg,#d94a43,#edbd47,#45bd70,#edbd47,#d94a43)}.balance-map:after{content:"";position:absolute;left:calc(50% + var(--offset));top:6px;width:14px;height:30px;margin-left:-7px;border:3px solid #062737;border-radius:8px;background:#fff;transition:.4s}.log{height:150px;margin-top:15px;padding:9px;overflow:auto;border:1px solid #315d6e;border-radius:8px;background:#031620;color:#a9ced7;font:10px/1.55 ui-monospace,monospace}.log b{color:#6ff0bb}.empty-note{position:absolute;z-index:2;color:#b9dce4;text-align:center}.empty-note strong{display:block;color:#fff;font-size:21px;margin-bottom:7px}@media(max-width:1000px){.layout{grid-template-columns:220px 1fr}.summary-panel{grid-column:1/-1}.summary{display:grid;grid-template-columns:160px 1fr 1fr;gap:15px}.log{margin-top:0}}@media(max-width:720px){body{overflow:auto}.top{height:auto;padding:12px}.layout{grid-template-columns:1fr}.manifest-panel{order:2}.work{min-height:500px}.summary-panel{grid-column:auto}.summary{display:block}.ship{width:100%;padding:12px 20px}.top nav a{font-size:11px;padding:8px}.brand strong{font-size:16px}}
  </style>
  <style>
    .config{display:flex;align-items:end;gap:11px;flex-wrap:wrap;padding:11px 20px;border-bottom:1px solid #4f92a766;background:#062536e8}.config strong{align-self:center;margin-right:8px;color:#7ff1dc}.config label{display:grid;gap:4px;color:#b9d9e1;font-size:10px}.config input,.cargo-count{border:1px solid #4e93a8;border-radius:6px;background:#031923;color:#fff;font:inherit;font-weight:800;text-align:center;outline:none}.config input{width:78px;padding:7px}.config input:focus,.cargo-count:focus{border-color:#70f1d5;box-shadow:0 0 0 2px #36cdb833}.cargo-count{width:48px;padding:5px}.cargo-count-wrap{display:flex;align-items:center;gap:3px;color:#ffd84c;font-size:11px}.axis-label{display:flex;justify-content:space-between;align-items:center;margin-top:11px;color:#a9cbd5;font-size:9px}.axis-label b{color:#eefbff;font-size:10px}.balance-map{margin-top:4px}.orientation{position:absolute;z-index:3;padding:5px 9px;border:1px solid #73d9e7;border-radius:14px;background:#062638e8;color:#eaffff;font-size:10px;font-weight:900;letter-spacing:.02em;box-shadow:0 4px 12px #00131f99;pointer-events:none}.orientation.bow{left:2%;top:50%;transform:translateY(-50%)}.orientation.stern{right:2%;top:50%;transform:translateY(-50%)}.orientation.port{left:50%;top:9px;transform:translateX(-50%)}.orientation.starboard{left:50%;bottom:9px;transform:translateX(-50%)}.empty-note{pointer-events:none}.cell:not(.filled){cursor:pointer}.cell.blocked{background:#241f29;box-shadow:inset 0 0 0 2px #c6132d}.cell.blocked:before,.cell.blocked:after{content:"";position:absolute;width:72%;height:4px;border-radius:4px;background:#e00025;box-shadow:0 0 5px #8d0018}.cell.blocked:before{transform:rotate(45deg)}.cell.blocked:after{transform:rotate(-45deg)}.layout{min-height:calc(100vh - 126px)}@media(max-width:720px){.config{padding:9px 12px}.config label{flex:1}.config input{width:100%}.orientation{font-size:8px;padding:4px 6px}}
  </style>

<body>
  <header class="top"><div class="brand"><b>⚓</b><strong>CARGO MASTER<span>AI STOWAGE LAB</span></strong></div><nav><a href="index.html">⌂ 타이틀</a><a id="start-game" href="cargo-hold.html?play=1">수동 시뮬레이션</a></nav></header>
  <section class="config"><strong>선박 공간 설정</strong><label>선창 층수<input id="hold-layers" type="number" min="1" max="30" value="2"></label><label>상갑판 층수<input id="deck-layers" type="number" min="1" max="10" value="2"></label><label>열 수(앞뒤)<input id="bay-columns" type="number" min="4" max="24" value="12"></label><label>행 수(좌우)<input id="bay-rows" type="number" min="3" max="10" value="5"></label><button id="apply-config">설정 적용</button></section>
  <main class="layout">
    <section class="panel manifest-panel"><h2>화물 목록 · 총 <span id="cargo-total">60</span>개</h2><div class="manifest" id="manifest"></div></section>
    <section class="panel work"><div class="stage-head"><h2>AI 배치 시뮬레이션</h2><span class="status" id="status">실행 대기</span></div><div class="view-tabs" id="tabs"></div><div class="ship-wrap"><span class="orientation bow">◀ 선수 · 배 앞</span><span class="orientation stern">배 뒤 · 선미 ▶</span><span class="orientation port">▲ 우현</span><span class="orientation starboard">▼ 좌현</span><div class="empty-note" id="empty"></div><div class="ship"><div class="grid" id="grid"></div></div></div><div class="legend"><span style="--c:#df493f">일반</span><span style="--c:#df9a35">플랫랙</span><span style="--c:#238bd8">냉동</span><span style="--c:#7d55a5">액체</span><span style="--c:#f06437">위험물</span><span style="--c:#252a30">중량</span></div></section>
    <aside class="panel summary-panel"><h2>최적화 결과</h2><div class="summary"><div class="score-ring" id="score-ring" style="--score:0"><b id="score">0</b></div><div><div class="metric"><div><span>종합 하중 분산</span><b id="balance-score">0%</b></div><div class="metric-track"><i id="balance-bar" style="--value:0%"></i></div></div><div class="metric"><div><span>공간 효율</span><b id="space-score">0%</b></div><div class="metric-track"><i id="space-bar" style="--value:0%"></i></div></div><div class="metric"><div><span>규칙 적합성</span><b id="rule-score">0%</b></div><div class="metric-track"><i id="rule-bar" style="--value:0%"></i></div></div></div><div><div class="axis-label"><span>우현</span><b>좌우 무게중심</b><span>좌현</span></div><div class="balance-map" id="side-balance-map" style="--offset:0px"></div><div class="axis-label"><span>선수</span><b>앞뒤 무게중심</b><span>선미</span></div><div class="balance-map" id="fore-balance-map" style="--offset:0px"></div><div class="log" id="log">AI 엔진 준비 완료</div></div><button class="primary" id="run" style="width:100%;margin-top:14px">✦ AI 최적화 실행</button></div></aside>
  </main>
  <script>
    let W=12,D=5,holdLayers=2,deckLayers=2;const colors={general:'#df493f',flat:'#df9a35',reefer:'#238bd8',liquid:'#7d55a5',flammable:'#f06437',heavy:'#252a30'};
    const names={general:'일반 화물',flat:'플랫랙',reefer:'냉동 화물',liquid:'액체 화물',flammable:'위험물',heavy:'중량 화물'};
    const specs=[['general',1,'G-20','20ft',14,1],['general',2,'G-40','40ft',12,2],['general',2,'G-HC','High 40ft',10,2.4],['flat',2,'F-40','40ft Flat Rack',4,2.2],['reefer',2,'R-40','40ft Reefer',4,2.6],['reefer',1,'R-20','20ft Reefer',4,1.4],['liquid',1,'L-20','20ft Tank',4,3],['flammable',1,'X-20','20ft Hazard',4,2.2],['heavy',2,'H-HC','High 40ft Heavy',4,6.5]];
    let cargo=[],board,placements=[],blocked=new Set,activeView='hold-0',running=false;
    const key=(area,x,z,y)=>`${area}:${x}:${z}:${y}`;
    function buildCargo(){cargo=[];for(const [type,size,id,dimension,count,weight] of specs)for(let n=0;n<count;n++)cargo.push({type,size,id,dimension,weight,serial:n+1});document.querySelector('#cargo-total').textContent=cargo.length;renderManifest()}
    function renderManifest(){const host=document.querySelector('#manifest');host.innerHTML='';specs.forEach((spec,index)=>{const [type,,id,dimension,count]=spec;const row=document.createElement('div');row.className='cargo';row.innerHTML=`<span class="swatch" style="background:${colors[type]}"></span><div><b>${id} · ${names[type]}</b><small>${dimension}</small></div><label class="cargo-count-wrap"><input class="cargo-count" data-spec="${index}" type="number" min="0" max="99" value="${count}">개</label>`;host.append(row)});host.querySelectorAll('.cargo-count').forEach(input=>input.onchange=()=>{const index=+input.dataset.spec;specs[index][4]=Math.max(0,Math.min(99,+input.value||0));input.value=specs[index][4];buildCargo();resetBoard();renderTabs()})}
    function resetBoard(){board=new Map;placements=[];document.querySelector('#log').innerHTML='AI 엔진 준비 완료';setScore(0,0,0,0,0,0);renderGrid()}
    function cells(item,p){return Array.from({length:item.size},(_,n)=>p.dir==='x'?[p.x+n,p.z]:[p.x,p.z+n])}
    function occupied(area,x,z,y,extra){return extra?.has(key(area,x,z,y))||board.has(key(area,x,z,y))}
    function reeferOpen(p,item,extra){const own=new Set(cells(item,p).map(([x,z])=>`${x}:${z}`));for(const [x,z] of cells(item,p))for(const [nx,nz] of [[x-1,z],[x+1,z],[x,z-1],[x,z+1]]){if(nx<0||nx>=W||nz<0||nz>=D)return true;if(own.has(`${nx}:${nz}`))continue;if(!occupied(p.area,nx,nz,p.y,extra))return true}return false}
    function sealsReefer(p,item){const extra=new Set(cells(item,p).map(([x,z])=>key(p.area,x,z,p.y)));for(const placed of placements){if(placed.item.type!=='reefer'||placed.area!==p.area||placed.y!==p.y)continue;if(!reeferOpen(placed,placed.item,extra))return true}return false}
    function layerCount(area){return area==='hold'?holdLayers:deckLayers}
    function valid(item,p){const fp=cells(item,p);if(p.y<0||p.y>=layerCount(p.area)||fp.some(([x,z])=>x<0||x>=W||z<0||z>=D||blocked.has(key(p.area,x,z,p.y))||occupied(p.area,x,z,p.y)))return false;if(p.y&&fp.some(([x,z])=>!board.has(key(p.area,x,z,p.y-1))))return false;if(p.y&&fp.some(([x,z])=>['flat','liquid','flammable'].includes(board.get(key(p.area,x,z,p.y-1)).item.type)))return false;if(item.type==='heavy'&&(p.area!=='hold'||p.y!==0||fp.some(([,z])=>Math.abs(z-(D-1)/2)>1)))return false;if(item.type==='liquid'&&p.area!=='hold')return false;if(item.type==='flat'&&p.area!=='deck')return false;if(item.type==='flammable'&&(p.area!=='deck'||fp.every(([,z])=>z>0&&z<D-1)))return false;if(item.type==='reefer'&&!reeferOpen(p,item))return false;if(sealsReefer(p,item))return false;return true}
    function balanceOffsetsWith(item,p){const all=item?[...placements,p]:placements;let weight=0,sideMoment=0,foreMoment=0;for(const q of all){const fp=cells(q.item,q);const centerX=fp.reduce((sum,[x])=>sum+x,0)/fp.length;const centerZ=fp.reduce((sum,[,z])=>sum+z,0)/fp.length;weight+=q.item.weight;sideMoment+=q.item.weight*(centerZ-(D-1)/2);foreMoment+=q.item.weight*(centerX-(W-1)/2)}return{side:weight?sideMoment/weight:0,fore:weight?foreMoment/weight:0}}
    function candidateScore(item,p){const offsets=balanceOffsetsWith(item,p);let score=100-Math.abs(offsets.side)*45-Math.abs(offsets.fore)*20;const adjacent=cells(item,p).reduce((sum,[x,z])=>sum+[[x-1,z],[x+1,z],[x,z-1],[x,z+1]].filter(([nx,nz])=>occupied(p.area,nx,nz,p.y)).length,0);score+=adjacent*3-score*.001;if(item.type==='heavy')score+=220-Math.abs(p.x-(W-1)/2)*4;if(item.type==='liquid')score+=p.y===0?115:45;if(item.type==='flat')score+=p.y===layerCount('deck')-1?130:40;if(item.type==='flammable')score+=p.y===layerCount('deck')-1?125:35;if(item.type==='reefer')score+=p.area==='deck'?95:25;if(item.type==='general')score+=p.area==='hold'?75:20;score-=p.y*8;return score+Math.random()*.2}
    function findBest(item){let best=null;for(const area of ['hold','deck'])for(let y=0;y<layerCount(area);y++)for(const dir of item.size===1?['x']:['x','z'])for(let z=0;z<D;z++)for(let x=0;x<W;x++){const p={area,x,z,y,dir,item};if(!valid(item,p))continue;const score=candidateScore(item,p);if(!best||score>best.score)best={...p,score}}return best}
    function commit(p){placements.push(p);for(const [x,z] of cells(p.item,p))board.set(key(p.area,x,z,p.y),p)}
    function log(text,ok=true){const host=document.querySelector('#log');host.innerHTML+=`<div>${ok?'<b>✓</b>':'⚠'} ${text}</div>`;host.scrollTop=host.scrollHeight}
    function orderCargo(){const priority={heavy:0,general:1,liquid:2,reefer:3,flat:4,flammable:5};return [...cargo].sort((a,b)=>priority[a.type]-priority[b.type]||b.size-a.size)}
    async function optimize(){if(running)return;running=true;buildCargo();resetBoard();document.querySelector('#empty').style.display='none';document.querySelector('#run').disabled=true;document.querySelector('#status').textContent='좌우·앞뒤 하중 분석 중';let failed=0,index=0;for(const item of orderCargo()){const p=findBest(item);if(p){commit(p);if(index%6===0){renderGrid();calculateScores()}if(index%10===0)log(`${item.id} 배치 · ${p.area==='hold'?'선창':'상갑판'} ${p.y+1}층`)}else{failed++;log(`${item.id} 배치 공간 부족`,false)}index++;await new Promise(r=>setTimeout(r,18))}renderGrid();calculateScores();document.querySelector('#status').textContent=failed?`완료 · 미배치 ${failed}개`:'최적 배치안 생성 완료';log(`총 ${placements.length}/${cargo.length}개 배치 완료`,failed===0);document.querySelector('#run').disabled=false;running=false}
    function calculateScores(){const offsets=balanceOffsetsWith();const sideScale=Math.max(1,(D-1)/2),foreScale=Math.max(1,(W-1)/2);const sideScore=Math.max(0,Math.round(100-Math.abs(offsets.side)/sideScale*100));const foreScore=Math.max(0,Math.round(100-Math.abs(offsets.fore)/foreScale*100));const balance=Math.round((sideScore+foreScore)/2);const used=board.size,capacity=W*D*(holdLayers+deckLayers)-blocked.size;const space=Math.min(100,Math.round(72+used/Math.max(1,capacity)*55));const rules=cargo.length?Math.round(placements.length/cargo.length*100):100;const total=Math.round(balance*.4+space*.25+rules*.35);setScore(total,balance,space,rules,offsets.side,offsets.fore)}
    function setScore(total,balance,space,rules,sideOffset=0,foreOffset=0){document.querySelector('#score').textContent=total;document.querySelector('#score-ring').style.setProperty('--score',total);for(const [id,value] of [['balance',balance],['space',space],['rule',rules]]){document.querySelector(`#${id}-score`).textContent=`${value}%`;document.querySelector(`#${id}-bar`).style.setProperty('--value',`${value}%`)}const sideScale=Math.max(1,(D-1)/2),foreScale=Math.max(1,(W-1)/2);document.querySelector('#side-balance-map').style.setProperty('--offset',`${Math.max(-90,Math.min(90,sideOffset/sideScale*90))}px`);document.querySelector('#fore-balance-map').style.setProperty('--offset',`${Math.max(-90,Math.min(90,foreOffset/foreScale*90))}px`)}
    function renderTabs(){const labels=[];for(let y=0;y<holdLayers;y++)labels.push([`hold-${y}`,`선창 ${y+1}층`]);for(let y=0;y<deckLayers;y++)labels.push([`deck-${y}`,`상갑판 ${y+1}층`]);if(!labels.some(([value])=>value===activeView))activeView=labels[0][0];const host=document.querySelector('#tabs');host.innerHTML='';for(const [value,label] of labels){const b=document.createElement('button');b.textContent=label;b.className=value===activeView?'active':'';b.onclick=()=>{activeView=value;renderTabs();renderGrid()};host.append(b)}}
    function renderGrid(){const [area,level]=activeView.split('-');const host=document.querySelector('#grid');host.innerHTML='';host.style.gridTemplateColumns=`repeat(${W},1fr)`;host.style.gridTemplateRows=`repeat(${D},1fr)`;document.querySelector('.ship').style.aspectRatio=`${Math.max(4,W)}/${Math.max(3,D)}`;for(let z=0;z<D;z++)for(let x=0;x<W;x++){const cell=document.createElement('div'),cellKey=key(area,x,z,+level),p=board.get(cellKey),isBlocked=blocked.has(cellKey);cell.className=`cell${p?' filled':''}${isBlocked?' blocked':''}`;if(p){cell.style.background=colors[p.item.type];cell.innerHTML=`<span>${p.item.id}</span><i>${p.item.serial}</i>`;cell.title=`${p.item.id} · ${names[p.item.type]}`}else{cell.title=isBlocked?'적재 금지 해제':'클릭하여 적재 금지';cell.onclick=()=>{if(running)return;isBlocked?blocked.delete(cellKey):blocked.add(cellKey);document.querySelector('#status').textContent=isBlocked?'적재 금지 칸 해제':'적재 금지 칸 지정';renderGrid();calculateScores()}}host.append(cell)}}
    function numberValue(id,min,max){const input=document.querySelector(`#${id}`);const value=Math.max(min,Math.min(max,Math.round(+input.value||min)));input.value=value;return value}
    function applyConfiguration(){holdLayers=numberValue('hold-layers',1,30);deckLayers=numberValue('deck-layers',1,10);W=numberValue('bay-columns',4,24);D=numberValue('bay-rows',3,10);blocked.clear();activeView='hold-0';buildCargo();resetBoard();renderTabs();document.querySelector('#empty').style.display='block';document.querySelector('#status').textContent='새 선박 설정 적용 완료';log(`${W}열 × ${D}행 · 선창 ${holdLayers}층 · 상갑판 ${deckLayers}층`)}
    function startConfiguredGame(event){event.preventDefault();document.querySelectorAll('.cargo-count').forEach(input=>{specs[+input.dataset.spec][4]=Math.max(0,Math.min(99,+input.value||0))});holdLayers=numberValue('hold-layers',1,30);deckLayers=numberValue('deck-layers',1,10);W=numberValue('bay-columns',4,24);D=numberValue('bay-rows',3,10);const blockedForGame=[...blocked].map(value=>{const [area,x,z,y]=value.split(':');return `${area}:${z}:${x}:${+y+(area==='deck'?holdLayers:0)}`}).join(';');const query=new URLSearchParams({play:'1',hold:String(holdLayers),deck:String(deckLayers),cols:String(W),rows:String(D),cargo:specs.map(spec=>spec[4]).join(','),blocked:blockedForGame});location.href=`cargo-hold.html?${query}`}
    document.querySelector('#run').onclick=optimize;document.querySelector('#apply-config').onclick=applyConfiguration;document.querySelector('#start-game').onclick=startConfiguredGame;buildCargo();resetBoard();renderTabs();
  </script>
</body>
</html>
