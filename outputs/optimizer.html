ing:18px}.tutorial-actions{padding:0 18px 18px}}

<body>
  <header class="top"><div class="brand"><b>⚓</b><strong>CARGO MASTER<span>AI STOWAGE LAB</span></strong></div><nav><button id="ai-help" type="button">? 도움말</button><a href="index.html">⌂ 타이틀</a><a id="start-game" href="cargo-hold.html?play=1">수동 시뮬레이션</a></nav></header>
  <section class="config"><strong>선박 공간 설정</strong><label>선창 층수<input id="hold-layers" type="number" min="1" max="30" value="2"></label><label>상갑판 층수<input id="deck-layers" type="number" min="1" max="10" value="4"></label><label>열 수(앞뒤)<input id="bay-columns" type="number" min="4" max="24" value="12"></label><label>행 수(좌우)<input id="bay-rows" type="number" min="3" max="10" value="5"></label><button id="apply-config">설정 적용</button></section>
  <main class="layout">

    <aside class="panel summary-panel"><h2>최적화 결과</h2><div class="summary"><div class="score-ring" id="score-ring" style="--score:0"><b id="score">0</b></div><div><div class="metric"><div><span>종합 하중 분산</span><b id="balance-score">0%</b></div><div class="metric-track"><i id="balance-bar" style="--value:0%"></i></div></div><div class="metric"><div><span>공간 효율</span><b id="space-score">0%</b></div><div class="metric-track"><i id="space-bar" style="--value:0%"></i></div></div><div class="metric"><div><span>규칙 적합성</span><b id="rule-score">0%</b></div><div class="metric-track"><i id="rule-bar" style="--value:0%"></i></div></div></div><div><div class="axis-label"><span>우현</span><b>좌우 무게중심</b><span>좌현</span></div><div class="balance-map" id="side-balance-map" style="--offset:0px"></div><div class="axis-label"><span>선수</span><b>앞뒤 무게중심</b><span>선미</span></div><div class="balance-map" id="fore-balance-map" style="--offset:0px"></div><div class="log" id="log">AI 엔진 준비 완료</div></div><button class="primary" id="run" style="width:100%;margin-top:14px">✦ AI 최적화 실행</button><button id="reset-result" style="width:100%;margin-top:8px;background:#17465a">↺ 화물 위치 초기화</button></div></aside>

  <div class="tutorial-backdrop" id="tutorial" role="dialog" aria-modal="true" aria-labelledby="tutorial-title">
    <article class="tutorial-card">
      <button class="tutorial-close" id="tutorial-close" type="button" aria-label="도움말 닫기">×</button>
      <header class="tutorial-head"><small>AI STOWAGE TUTORIAL</small><h2 id="tutorial-title">AI 시뮬레이션 사용법</h2></header>
      <div class="tutorial-body">
        <div class="tutorial-visual"><div class="tutorial-icon" id="tutorial-icon">⚙</div><div class="tutorial-copy"><h3 id="tutorial-step-title"></h3><p id="tutorial-step-copy"></p></div></div>

  </div>
  <script>
    let W=12,D=5,holdLayers=2,deckLayers=4;const colors={general:'#df493f',flat:'#df9a35',reefer:'#238bd8',liquid:'#7d55a5',flammable:'#f06437',heavy:'#252a30'};
    const names={general:'일반 화물',flat:'플랫랙',reefer:'냉동 화물',liquid:'액체 화물',flammable:'위험물',heavy:'중량 화물'};
    const specs=[
      ['general',1,'G-20','20ft',14,1],['general',2,'G-40','40ft',12,2],['general',2,'G-HC','High Cube 40ft',10,2.4],
      ['flat',1,'F-20','20ft Flat Rack',0,1.3],['flat',2,'F-40','40ft Flat Rack',4,2.2],['flat',2,'F-HC','High Cube Flat Rack',0,2.6],
      ['reefer',1,'R-20','20ft Reefer',4,1.4],['reefer',2,'R-40','40ft Reefer',4,2.6],['reefer',2,'R-HC','High Cube Reefer',0,3],
      ['liquid',1,'L-20','20ft Tank',4,3],['liquid',2,'L-40','40ft Tank',0,5.5],['liquid',2,'L-HC','High Cube Tank',0,6],
      ['flammable',1,'X-20','20ft Hazard',4,2.2],['flammable',2,'X-40','40ft Hazard',0,4.2],['flammable',2,'X-HC','High Cube Hazard',0,4.6],
      ['heavy',1,'H-20','20ft Heavy',0,4],['heavy',2,'H-40','40ft Heavy',0,6],['heavy',2,'H-HC','High Cube Heavy',4,6.5]
    ];
    let cargo=[],board,placements=[],blocked=new Set,cellZones=new Map,activeView='hold-0',running=false;
    const key=(area,x,z,y)=>`${area}:${x}:${z}:${y}`;
    function buildCargo(){cargo=[];for(const [type,size,id,dimension,count,weight] of specs)for(let n=0;n<count;n++)cargo.push({type,size,id,dimension,weight,serial:n+1});document.querySelector('#cargo-total').textContent=cargo.length;renderManifest()}
    function renderManifest(){const host=document.querySelector('#manifest');host.innerHTML='';specs.forEach((spec,index)=>{const [type,,id,dimension,count]=spec;const row=document.createElement('div');row.className='cargo';row.innerHTML=`<span class="swatch" style="background:${colors[type]}"></span><div><b>${id} · ${names[type]}</b><small>${dimension}</small></div><label class="cargo-count-wrap"><input class="cargo-count" data-spec="${index}" type="number" min="0" max="99" value="${count}">개</label>`;host.append(row)});host.querySelectorAll('.cargo-count').forEach(input=>input.onchange=()=>{const index=+input.dataset.spec;specs[index][4]=Math.max(0,Math.min(99,+input.value||0));input.value=specs[index][4];buildCargo();resetBoard();renderTabs()})}
    function resetBoard(){board=new Map;placements=[];document.querySelector('#log').innerHTML='AI 엔진 준비 완료';setScore(0,0,0,0,0,0);renderGrid()}
    function cells(item,p){return Array.from({length:item.size},(_,n)=>p.dir==='x'?[p.x+n,p.z]:[p.x,p.z+n])}
    function occupied(area,x,z,y,extra){return extra?.has(key(area,x,z,y))||board.has(key(area,x,z,y))}
    function reeferOpen(p,item,extra){const own=new Set(cells(item,p).map(([x,z])=>`${x}:${z}`));for(const [x,z] of cells(item,p))for(const [nx,nz] of [[x-1,z],[x+1,z],[x,z-1],[x,z+1]]){if(nx<0||nx>=W||nz<0||nz>=D)return true;if(own.has(`${nx}:${nz}`))continue;if(!occupied(p.area,nx,nz,p.y,extra))return true}return false}
    function sealsReefer(p,item){const extra=new Set(cells(item,p).map(([x,z])=>key(p.area,x,z,p.y)));for(const placed of placements){if(placed.item.type!=='reefer'||placed.area!==p.area||placed.y!==p.y)continue;if(!reeferOpen(placed,placed.item,extra))return true}return false}
    function layerCount(area){return area==='hold'?holdLayers:deckLayers}
    function valid(item,p){const fp=cells(item,p),allZone=zone=>fp.every(([x,z])=>cellZones.get(key(p.area,x,z,p.y))===zone);if(p.y<0||p.y>=layerCount(p.area)||fp.some(([x,z])=>x<0||x>=W||z<0||z>=D||blocked.has(key(p.area,x,z,p.y))||occupied(p.area,x,z,p.y)))return false;if(p.y&&fp.some(([x,z])=>!board.has(key(p.area,x,z,p.y-1))))return false;if(p.y&&fp.some(([x,z])=>['flat','liquid','flammable'].includes(board.get(key(p.area,x,z,p.y-1)).item.type)))return false;if(item.type==='heavy'&&(p.area!=='hold'||p.y!==0||fp.some(([,z])=>Math.abs(z-(D-1)/2)>1)))return false;if(item.type==='liquid'&&p.area!=='hold'&&!allZone('tank'))return false;if(item.type==='flat'&&p.area!=='deck'&&!allZone('flat'))return false;if(item.type==='flammable'&&!allZone('tank')&&(p.area!=='deck'||fp.every(([,z])=>z>0&&z<D-1)))return false;if(item.type==='reefer'&&!allZone('reefer')&&!reeferOpen(p,item))return false;if(sealsReefer(p,item))return false;return true}
    function balanceOffsetsWith(item,p){const all=item?[...placements,p]:placements;let weight=0,sideMoment=0,foreMoment=0;for(const q of all){const fp=cells(q.item,q);const centerX=fp.reduce((sum,[x])=>sum+x,0)/fp.length;const centerZ=fp.reduce((sum,[,z])=>sum+z,0)/fp.length;weight+=q.item.weight;sideMoment+=q.item.weight*(centerZ-(D-1)/2);foreMoment+=q.item.weight*(centerX-(W-1)/2)}return{side:weight?sideMoment/weight:0,fore:weight?foreMoment/weight:0}}
    function candidateScore(item,p){const offsets=balanceOffsetsWith(item,p);let score=100-Math.abs(offsets.side)*45-Math.abs(offsets.fore)*20;const adjacent=cells(item,p).reduce((sum,[x,z])=>sum+[[x-1,z],[x+1,z],[x,z-1],[x,z+1]].filter(([nx,nz])=>occupied(p.area,nx,nz,p.y)).length,0);score+=adjacent*3-score*.001;if(item.type==='heavy')score+=220-Math.abs(p.x-(W-1)/2)*4;if(item.type==='liquid')score+=p.y===0?115:45;if(item.type==='flat')score+=p.y===layerCount('deck')-1?130:40;if(item.type==='flammable')score+=p.y===layerCount('deck')-1?125:35;if(item.type==='reefer')score+=p.area==='deck'?95:25;if(item.type==='general')score+=p.area==='hold'?75:20;score-=p.y*8;return score+Math.random()*.2}
    function findBest(item){let best=null;for(const area of ['hold','deck'])for(let y=0;y<layerCount(area);y++)for(const dir of item.size===1?['x']:['x','z'])for(let z=0;z<D;z++)for(let x=0;x<W;x++){const p={area,x,z,y,dir,item};if(!valid(item,p))continue;const score=candidateScore(item,p);if(!best||score>best.score)best={...p,score}}return best}
    function commit(p){placements.push(p);for(const [x,z] of cells(p.item,p))board.set(key(p.area,x,z,p.y),p)}
    function log(text,ok=true){const host=document.querySelector('#log');host.innerHTML+=`<div>${ok?'<b>✓</b>':'⚠'} ${text}</div>`;host.scrollTop=host.scrollHeight}
    function orderCargo(){const priority={heavy:0,general:1,liquid:2,reefer:3,flat:4,flammable:5};return [...cargo].sort((a,b)=>priority[a.type]-priority[b.type]||b.size-a.size)}
    async function optimize(){if(running)return;running=true;buildCargo();resetBoard();document.querySelector('#empty').style.display='none';document.querySelector('#run').disabled=true;document.querySelector('#status').textContent='좌우·앞뒤 하중 분석 중';let failed=0,index=0;for(const item of orderCargo()){const p=findBest(item);if(p){commit(p);if(index%6===0){renderGrid();calculateScores()}if(index%10===0)log(`${item.id} 배치 · ${p.area==='hold'?'선창':'상갑판'} ${p.y+1}층`)}else{failed++;log(`${item.id} 배치 공간 부족`,false)}index++;await new Promise(r=>setTimeout(r,18))}renderGrid();calculateScores();document.querySelector('#status').textContent=failed?`완료 · 미배치 ${failed}개`:'최적 배치안 생성 완료';log(`총 ${placements.length}/${cargo.length}개 배치 완료`,failed===0);document.querySelector('#run').disabled=false;running=false}
    function calculateScores(){if(placements.length===0){setScore(0,0,0,0,0,0);return}const offsets=balanceOffsetsWith();const sideScale=Math.max(1,(D-1)/2),foreScale=Math.max(1,(W-1)/2);const sideScore=Math.max(0,Math.round(100-Math.abs(offsets.side)/sideScale*100));const foreScore=Math.max(0,Math.round(100-Math.abs(offsets.fore)/foreScale*100));const balance=Math.round((sideScore+foreScore)/2);const used=board.size,capacity=W*D*(holdLayers+deckLayers)-blocked.size;const space=Math.min(100,Math.round(72+used/Math.max(1,capacity)*55));const rules=cargo.length?Math.round(placements.length/cargo.length*100):100;const total=Math.round(balance*.4+space*.25+rules*.35);setScore(total,balance,space,rules,offsets.side,offsets.fore)}
    function setScore(total,balance,space,rules,sideOffset=0,foreOffset=0){document.querySelector('#score').textContent=total;document.querySelector('#score-ring').style.setProperty('--score',total);for(const [id,value] of [['balance',balance],['space',space],['rule',rules]]){document.querySelector(`#${id}-score`).textContent=`${value}%`;document.querySelector(`#${id}-bar`).style.setProperty('--value',`${value}%`)}const sideScale=Math.max(1,(D-1)/2),foreScale=Math.max(1,(W-1)/2);document.querySelector('#side-balance-map').style.setProperty('--offset',`${Math.max(-90,Math.min(90,sideOffset/sideScale*90))}px`);document.querySelector('#fore-balance-map').style.setProperty('--offset',`${Math.max(-90,Math.min(90,foreOffset/foreScale*90))}px`)}
    function renderTabs(){const labels=[];for(let y=0;y<holdLayers;y++)labels.push([`hold-${y}`,`선창 ${y+1}층`]);for(let y=0;y<deckLayers;y++)labels.push([`deck-${y}`,`상갑판 ${y+1}층`]);if(!labels.some(([value])=>value===activeView))activeView=labels[0][0];const host=document.querySelector('#tabs');host.innerHTML='';for(const [value,label] of labels){const b=document.createElement('button');b.textContent=label;b.className=value===activeView?'active':'';b.onclick=()=>{activeView=value;renderTabs();renderGrid()};host.append(b)}}
    function renderGrid(){const [area,level]=activeView.split('-'),zoneOrder=['none','blocked','flat','reefer','tank'],zoneLabels={none:'일반 칸',blocked:'적재 금지',flat:'플랫랙 전용',reefer:'냉동 전원',tank:'탱크 안전구역'};const host=document.querySelector('#grid');host.innerHTML='';host.style.gridTemplateColumns=`repeat(${W},1fr)`;host.style.gridTemplateRows=`repeat(${D},1fr)`;document.querySelector('.ship').style.aspectRatio=`${Math.max(4,W)}/${Math.max(3,D)}`;for(let z=0;z<D;z++)for(let x=0;x<W;x++){const cellKey=key(area,x,z,+level),p=board.get(cellKey),zone=cellZones.get(cellKey)||'none',isBlocked=zone==='blocked';if(p&&(x!==p.x||z!==p.z))continue;const cell=document.createElement('div');cell.style.gridColumn=p&&p.dir==='x'?`${x+1}/span ${p.item.size}`:`${x+1}`;cell.style.gridRow=p&&p.dir==='z'?`${z+1}/span ${p.item.size}`:`${z+1}`;cell.className=`cell${p?' filled':''}${p?.item.size>1?' long':''}${p?.item.id.includes('HC')?' high-cube':''}${isBlocked?' blocked':''}${!p&&zone!=='none'&&zone!=='blocked'?` zone-${zone}`:''}`;if(p){cell.style.background=colors[p.item.type];cell.innerHTML=`<span>${p.item.id}</span><i>${p.item.serial}</i>`;cell.title=`${p.item.id} · ${names[p.item.type]} · ${p.item.dimension}`}else{cell.title=`현재: ${zoneLabels[zone]} · 클릭하여 다음 구역 선택`;cell.onclick=()=>{if(running)return;const next=zoneOrder[(zoneOrder.indexOf(zone)+1)%zoneOrder.length];blocked.delete(cellKey);next==='none'?cellZones.delete(cellKey):cellZones.set(cellKey,next);if(next==='blocked')blocked.add(cellKey);document.querySelector('#status').textContent=`${zoneLabels[next]} 지정`;renderGrid();calculateScores()}}host.append(cell)}}
    function numberValue(id,min,max){const input=document.querySelector(`#${id}`);const value=Math.max(min,Math.min(max,Math.round(+input.value||min)));input.value=value;return value}
    function applyConfiguration(){holdLayers=numberValue('hold-layers',1,30);deckLayers=numberValue('deck-layers',1,10);W=numberValue('bay-columns',4,24);D=numberValue('bay-rows',3,10);blocked.clear();cellZones.clear();activeView='hold-0';buildCargo();resetBoard();renderTabs();document.querySelector('#empty').style.display='block';document.querySelector('#status').textContent='새 선박 설정 적용 완료';log(`${W}열 × ${D}행 · 선창 ${holdLayers}층 · 상갑판 ${deckLayers}층`)}
    function resetOptimizationResult(){if(running)return;resetBoard();document.querySelector('#empty').style.display='none';document.querySelector('#status').textContent='화물 위치 초기화 완료'}
    function startConfiguredGame(event){event.preventDefault();document.querySelectorAll('.cargo-count').forEach(input=>{specs[+input.dataset.spec][4]=Math.max(0,Math.min(99,+input.value||0))});holdLayers=numberValue('hold-layers',1,30);deckLayers=numberValue('deck-layers',1,10);W=numberValue('bay-columns',4,24);D=numberValue('bay-rows',3,10);const convert=value=>{const [area,x,z,y]=value.split(':');return `${area}:${z}:${x}:${+y+(area==='deck'?holdLayers:0)}`},blockedForGame=[...blocked].map(convert).join(';'),zonesForGame=[...cellZones].filter(([,zone])=>zone!=='blocked').map(([value,zone])=>`${convert(value)}=${zone}`).join(';');const query=new URLSearchParams({play:'1',hold:String(holdLayers),deck:String(deckLayers),cols:String(W),rows:String(D),cargo:specs.map(spec=>spec[4]).join(','),blocked:blockedForGame,zones:zonesForGame});location.href=`cargo-hold.html?${query}`}
    const tutorialSteps=[
      {icon:'⚙',title:'1. 선박 공간 설정',copy:'선창과 상갑판의 층 수, 화물이 들어갈 칸의 앞뒤 열 수와 좌우 행 수를 입력한 뒤 ‘설정 적용’을 누르세요.',tip:'<b>설정 적용</b>을 누르면 기존 배치와 특수구역이 초기화되고 새로운 선박 구조가 생성됩니다.'},
      {icon:'📦',title:'2. 화물 수량 입력',copy:'왼쪽 화물 목록에서 20피트·40피트·High Cube와 일반·플랫랙·냉동·액체·위험물·중량 화물의 수량을 각각 입력하세요.',tip:'수량을 0으로 입력하면 해당 화물은 최적화와 수동 시뮬레이션에서 제외됩니다.'},
      {icon:'▦',title:'3. 층과 특수구역 지정',copy:'가운데 위쪽의 선창·상갑판 층 버튼으로 작업할 층을 고릅니다. 빈 칸을 반복 클릭하면 칸의 용도가 순서대로 바뀝니다.',tip:'1회: <b>적재 금지</b> → 2회: <b>플랫랙 전용</b> → 3회: <b>냉동 전원</b> → 4회: <b>탱크 안전구역</b> → 5회: 일반 칸'},
      {icon:'✦',title:'4. AI 최적화 실행',copy:'오른쪽 아래의 ‘AI 최적화 실행’을 누르면 AI가 규칙 적합성, 공간 효율, 좌우 및 앞뒤 무게중심을 함께 계산하여 화물을 배치합니다.',tip:'배치할 화물이 0개이면 점수는 생성되지 않습니다. 공간보다 화물이 많으면 미배치 개수가 상태창에 표시됩니다.'},
      {icon:'◎',title:'5. 결과 확인과 초기화',copy:'오른쪽 결과에서 종합 점수, 하중 분산, 공간 효율, 규칙 적합성, 좌우·앞뒤 무게중심을 확인하세요. 각 층 버튼을 눌러 실제 배치도 확인할 수 있습니다.',tip:'<b>화물 위치 초기화</b>는 설정과 특수구역은 유지하고 AI가 놓은 화물만 제거합니다.'},
      {icon:'🚢',title:'6. 수동 시뮬레이션',copy:'상단의 ‘수동 시뮬레이션’을 누르면 현재 입력한 선박 크기, 층 수, 화물 수량, 적재 금지 칸과 특수구역을 그대로 사용하여 직접 적재할 수 있습니다.',tip:'수동 화면에서는 화물을 선택한 뒤 빈 칸을 클릭해 적재하고, 우클릭으로 40피트 화물을 회전하며, 화물 위에서 Backspace를 누르면 되돌릴 수 있습니다.'}
    ];
    let tutorialIndex=0;
    function renderTutorial(){const step=tutorialSteps[tutorialIndex];document.querySelector('#tutorial-icon').textContent=step.icon;document.querySelector('#tutorial-step-title').textContent=step.title;document.querySelector('#tutorial-step-copy').textContent=step.copy;document.querySelector('#tutorial-tip').innerHTML=step.tip;document.querySelector('#tutorial-prev').style.visibility=tutorialIndex?'visible':'hidden';document.querySelector('#tutorial-next').textContent=tutorialIndex===tutorialSteps.length-1?'완료':'다음';document.querySelector('#tutorial-progress').innerHTML=tutorialSteps.map((_,index)=>`<i class="${index<=tutorialIndex?'active':''}"></i>`).join('')}
    function openTutorial(){tutorialIndex=0;renderTutorial();document.querySelector('#tutorial').classList.add('open')}
    function closeTutorial(){document.querySelector('#tutorial').classList.remove('open')}
    document.querySelector('#ai-help').onclick=openTutorial;document.querySelector('#tutorial-close').onclick=closeTutorial;document.querySelector('#tutorial-prev').onclick=()=>{if(tutorialIndex){tutorialIndex--;renderTutorial()}};document.querySelector('#tutorial-next').onclick=()=>{if(tutorialIndex<tutorialSteps.length-1){tutorialIndex++;renderTutorial()}else closeTutorial()};document.querySelector('#tutorial').onclick=event=>{if(event.target.id==='tutorial')closeTutorial()};document.addEventListener('keydown',event=>{if(event.key==='Escape')closeTutorial()});
    document.querySelector('#run').onclick=optimize;document.querySelector('#reset-result').onclick=resetOptimizationResult;document.querySelector('#apply-config').onclick=applyConfiguration;document.querySelector('#start-game').onclick=startConfiguredGame;buildCargo();resetBoard();renderTabs();
  </script>
